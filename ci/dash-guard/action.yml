name: dash-guard
description: House rule that published prose carries no en/em dash, checked against the CALLING repo.

# It scans the current tree only: a dash in old history is harmless and needs no rewrite. That is
# the difference between this gate and the security kit's, and the reason the two are separate
# repos: nothing here keeps a real identifier out of a public history.
#
# The steps live here rather than in a workflow every consumer copies, because copied into every
# repo the reasoning for each step becomes divergent copies of an argument, and copies drift.

inputs:
  # The kinds added on 2026-09-25 (js, yaml, sh, ps and cmd comments, commit messages, and files the
  # guard could not read) REPORT by default: they print and are counted on the verdict line, and do
  # not change the exit code. A consumer promotes a kind to blocking here once its report is clean.
  # Empty keeps the pre-rollout verdict exactly, so bumping the pointer turns nobody red.
  block-kinds:
    description: "Comma list of report-only kinds to make blocking (js, yaml, sh, ps, cmd, message, unexamined), or 'all'. Empty means report only."
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Run the guard's OWN tests first, exactly as pii-guard does. The reason is not symmetry: until
    # 2026-07-30 a git failure (not a repo, no git on PATH, an index lock, an extracted archive)
    # made the scanner enumerate zero files and print "dash_guard: clean" with exit 0. This job's
    # entire content is one command, so a run that examined nothing reported success.
    - name: Guard's own tests (a scan that never ran must not report clean)
      shell: bash
      run: |
        python -m pip install --quiet pytest
        python -m pytest "$GITHUB_ACTION_PATH/../../tools/test_dash_guard.py" -q

    - name: No en/em dash in published prose
      shell: bash
      env:
        DASH_BLOCK_KINDS: ${{ inputs.block-kinds }}
      run: python "$GITHUB_ACTION_PATH/../../tools/dash_guard.py" --tree --block-kinds "$DASH_BLOCK_KINDS"
