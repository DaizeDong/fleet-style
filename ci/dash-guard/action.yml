name: dash-guard
description: House rule that published prose carries no en/em dash, checked against the CALLING repo.

# It scans the current tree only: a dash in old history is harmless and needs no rewrite.

inputs:
  block-kinds:
    description: "Comma list of comment or message kinds to block, or all. Incomplete scans always block."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: No en/em dash in published prose
      shell: bash
      env:
        DASH_BLOCK_KINDS: ${{ inputs.block-kinds }}
      run: python "$GITHUB_ACTION_PATH/../../tools/dash_guard.py" --check --tree --block-kinds "$DASH_BLOCK_KINDS"
