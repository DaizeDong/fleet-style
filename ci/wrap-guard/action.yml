name: wrap-guard
description: House rule that prose paragraphs carry no hard wraps, checked against the CALLING repo.

# Line length is not a reason to break text: the receiving end (a form field, a browser window)
# wraps to its own width. A paragraph is ONE line; blank lines separate paragraphs. The only places
# a newline belongs are between paragraphs, between list items, inside code blocks, and inside
# ASCII tables where alignment carries meaning.
#
# Like dash-guard this scans the current tree only. A hard wrap in old history is harmless and
# needs no rewrite, which is exactly why this kit is separate from the security one: nothing here
# keeps a real identifier out of a public history.
#
# ONE surface this action does NOT cover: commit messages. Those are caught by the machine-level
# `commit-msg` hook, because a message never reaches CI as a file. If you are reading this while
# wondering why a wrapped commit body got through, that hook is what to check.

runs:
  using: composite
  steps:
    # The guard's OWN tests run first, and that ordering is load-bearing rather than tidy. This
    # job's entire content is one command, so a scanner that enumerated zero files would print a
    # clean line and exit 0: a run that examined nothing would report success. dash-guard learned
    # this the hard way in 2026-07 when a git failure produced exactly that.
    - name: Guard's own tests (a scan that never ran must not report clean)
      shell: bash
      run: |
        python -m pip install --quiet pytest
        python -m pytest "$GITHUB_ACTION_PATH/../../tools/test_wrap_guard.py" -q

    # --tree, never --fix. `--fix` rewrites the files and then exits 0, so wiring it in here would
    # install a check that cannot fail.
    - name: No hard wraps inside prose paragraphs
      shell: bash
      run: python "$GITHUB_ACTION_PATH/../../tools/wrap_guard.py" --tree
